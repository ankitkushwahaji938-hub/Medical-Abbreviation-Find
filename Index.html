<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pharma Drug Info Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family: Arial, sans-serif;
      text-align: center;
      background:#f5f5f5;
      padding:40px;
    }
    h1{
      color:#2c3e50;
    }
    input{
      padding:10px;
      width:250px;
      border-radius:5px;
      border:1px solid #ccc;
    }
    button{
      padding:10px 15px;
      margin-left:5px;
      border:none;
      background:#4CAF50;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }
    button:hover{
      background:#45a049;
    }
    #result{
      margin-top:20px;
      font-size:18px;
      color:#333;
    }
  </style>
</head>

<body>

  <h1>💊 Pharma Drug Info Tool</h1>

  <input id="drug" placeholder="Enter drug name">
  <button onclick="searchDrug()">Search</button>

  <p id="result"></p>

  <script>
    function searchDrug(){
      let drug = document.getElementById("drug").value.toLowerCase();

      let info = {
        "paracetamol": "Used for fever and pain relief",
        "ibuprofen": "Used for inflammation and pain",
        "aspirin": "Used as blood thinner and pain relief"
      };

      document.getElementById("result").innerText =
      info[drug] || "Drug not found";
    }
  </script>

</body>
</html>
